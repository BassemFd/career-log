# Weekly: refresh live GitHub stats + draft new public repos, deploy, then open
# a PR with the content changes (main is protected: no direct pushes).
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" enabled.
# Free: public repo Actions minutes + Cloudflare Workers free tier.
# Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template)
# and CLOUDFLARE_ACCOUNT_ID.
name: refresh

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run refresh-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Open PR with refreshed stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet content && exit 0
          branch="chore/refresh-stats-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add content
          git commit -m "chore(stats): refresh live github stats"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(stats): refresh live github stats" \
            --body "Automated weekly refresh of the live stats block." \
            || echo "PR already exists or could not be created"
